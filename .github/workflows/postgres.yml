# Runs the whole test suite against a real Postgres.
# MINAB_REQUIRE_DATABASE=1 makes test/postgres.test.ts fail instead of skip
# when the database URL is missing, so this job cannot pass by skipping.
name: Postgres

on:
  push:
    branches: [main]
  pull_request:

jobs:
  postgres:
    # Our own runner; pull requests from forks run on GitHub's (docs/ci-runner.md).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'minab' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: minab
          POSTGRES_PASSWORD: minab
          POSTGRES_DB: minab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minab -d minab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MINAB_TEST_DATABASE_URL: postgresql://minab:minab@localhost:5432/minab_test
      MINAB_REQUIRE_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- test/postgres.test.ts --reporter=verbose
      - run: npm test
