# Checks the built website (W4): Lighthouse, axe accessibility, a smoke test.
# They run against `vite preview` of the production build, in CI, so they need
# no secrets and also work for fork pull requests.
name: Site checks

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'src/**'
      - '.github/workflows/site-checks.yml'
  pull_request:
    paths:
      - 'playground/**'
      - 'src/**'
      - '.github/workflows/site-checks.yml'

permissions:
  contents: read

jobs:
  playwright:
    # Our own runner; pull requests from forks run on GitHub's (docs/ci-runner.md).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'minab' }}
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm ci
      # Our runner has the system libraries already and cannot use sudo (docs/ci-runner.md).
      - run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - run: npm run build
      - run: npm run test:site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playground/playwright-report
          retention-days: 7

  lighthouse:
    # Our own runner; pull requests from forks run on GitHub's (docs/ci-runner.md).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'minab' }}
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run build
      # GitHub's runners have Chrome. Ours does not, so Lighthouse uses Playwright's Chromium.
      - name: Install Chromium for Lighthouse
        if: runner.environment != 'github-hosted'
        run: |
          npx playwright install chromium
          echo "CHROME_PATH=$(node -p "require('@playwright/test').chromium.executablePath()")" >> "$GITHUB_ENV"
      - run: npm run lighthouse
