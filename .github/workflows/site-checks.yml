# Checks the built website (W4): Lighthouse, axe accessibility, a smoke test.
# They run against `vite preview` of the production build, in CI, so they need
# no secrets and also work for fork pull requests.
name: Site checks

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'src/**'
      - '.github/workflows/site-checks.yml'
  pull_request:
    paths:
      - 'playground/**'
      - 'src/**'
      - '.github/workflows/site-checks.yml'

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playground/playwright-report
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run build
      - run: npm run lighthouse
