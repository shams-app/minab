# Deploys the website to Cloudflare Pages (W4, D41).
# - Push to main (playground or src changed): the live site.
# - Pull request: a preview deploy. Its URL goes to the run summary.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (permission "Cloudflare
# Pages: Edit") and CLOUDFLARE_ACCOUNT_ID. The Pages project `minab` must exist.
# Pull requests from forks have no secrets, so they get no preview.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    paths:
      - 'playground/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: minab

jobs:
  deploy:
    # Our own runner (docs/ci-runner.md).
    runs-on: minab
    # Fork pull requests cannot read secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
      # The playground compiles src/language from source, so the root needs its
      # dependencies too (the parser is generated by "prepare:language").
      - run: npm ci
      - run: npm ci
        working-directory: playground
      - run: npm run build
        working-directory: playground
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy playground/dist
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
            --commit-dirty=true
      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          KIND: ${{ github.event_name == 'pull_request' && 'Preview' || 'Live deploy' }}
        run: |
          {
            echo "### $KIND"
            echo
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
