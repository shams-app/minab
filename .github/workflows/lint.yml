# Lint and format check (B1). One job per file: see docs/production/README.md.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # Our own runner; pull requests from forks run on GitHub's (docs/ci-runner.md).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'minab' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: playground
      # `npm run lint` generates the parser first (the "prelint" script), because
      # the type-aware rules need the generated types.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run lint
        working-directory: playground
      - run: npm run format:check
        working-directory: playground
