# Packs the package and loads it from five kinds of project: ES module, CommonJS,
# Jest, Bun, and TypeScript with `moduleResolution: node` (H1, D32, D06).
name: Consumers

on:
  push:
    branches: [main]
  pull_request:

jobs:
  consumers:
    # Our own runner; pull requests from forks run on GitHub's (docs/ci-runner.md).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'minab' }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run test:consumers
