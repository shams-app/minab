# Checks dependencies for known security problems (high or worse).
#
# The gate checks what ships (`--omit=dev`). A second step audits the dev tools
# too. It does not fail the job, but it prints the advisories (and a warning), so
# a problem in a build tool stays visible. Example: `braces` (GHSA-vfj7-8cjw-p6xm)
# has no patched version yet and reaches `@vscode/vsce`, a packaging tool.
name: Audit

on:
  pull_request:
    paths:
      - '**/package-lock.json'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  audit:
    # Our own runner; pull requests from forks run on GitHub's (docs/ci-runner.md).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'minab' }}
    strategy:
      fail-fast: false
      matrix:
        dir: [., playground, vscode-extension]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit shipped dependencies (fails on high)
        run: npm audit --audit-level=high --omit=dev
        working-directory: ${{ matrix.dir }}
      - name: Audit dev tools too (report only)
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.dir }}
