# Keeps bun.lock and playground/bun.lock in sync with package.json.
# npm is the main package manager; the bun lockfiles must not drift (D07).
name: Bun lockfiles

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bun-lock:
    # Our own runner; pull requests from forks run on GitHub's (docs/ci-runner.md).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'minab' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: playground
