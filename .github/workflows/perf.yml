# Performance budgets (Q4). One job per file: see docs/production/README.md.
# It builds the code, runs the bench and fails when a row is above its budget times the allowance.
# The table goes to the job summary.
name: Performance

on:
  pull_request:
    paths:
      - 'src/**'
      - 'bench/**'
      - 'scripts/browser-bundle.mjs'
      - '.github/workflows/perf.yml'
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bench:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench/results.json
