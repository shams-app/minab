# Builds the VS Code extension, packages it and checks what is inside.
name: Extension

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    # Our own runner; pull requests from forks run on GitHub's (docs/ci-runner.md).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'minab' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      # The extension bundles src/language/main.ts, so build the root first.
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: vscode-extension
      - run: npm run build
        working-directory: vscode-extension
      - run: npm run package
        working-directory: vscode-extension
      - run: npm run check:vsix
        working-directory: vscode-extension
      - uses: actions/upload-artifact@v4
        with:
          name: minab-vscode-vsix
          path: vscode-extension/*.vsix
          if-no-files-found: error
