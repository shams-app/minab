<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minab — a query and validation language</title>
    <meta name="description" content="Minab is a small language for querying relational data and validating records. Write it, check it, compile it to PostgreSQL and run it — all in your browser." />
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Minab — a query and validation language" />
    <meta property="og:description" content="One small language for querying relational data and validating records. Try it live: a real PostgreSQL runs in your browser." />
    <meta property="og:site_name" content="Minab" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Minab mark and wordmark, with a booking rule that passes and sends one statement to PostgreSQL." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Minab — a query and validation language" />
    <meta name="twitter:description" content="One small language for querying relational data and validating records. Try it live: a real PostgreSQL runs in your browser." />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply a saved theme before first paint, so visitors who chose light never see a dark flash.
      try {
        var t = JSON.parse(localStorage.getItem('minab-playground:theme') || 'null');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The Minab playground runs the language in your browser, so it needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
